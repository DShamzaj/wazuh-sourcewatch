# ---------------------------------------------------------------------------
# SourceWatch - add these lines to opensearch_dashboards.yml
#   Package install: /etc/wazuh-dashboard/opensearch_dashboards.yml
#   wazuh-docker:    config/wazuh_dashboard/opensearch_dashboards.yml
# Only the wazuhApi block is required; everything else has sensible defaults.
# ---------------------------------------------------------------------------

# Wazuh server API: needed for native alerts (rules 100700-100706) and contracts
sourcewatch.wazuhApi.enabled: true
sourcewatch.wazuhApi.url: "https://<wazuh-manager>:55000"
sourcewatch.wazuhApi.username: "<api-user>"
sourcewatch.wazuhApi.password: "<api-password>"
sourcewatch.wazuhApi.verifyTls: false

# --- Optional tuning (defaults shown) ---
